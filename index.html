
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Alumnos - API REST</title>

    <link rel="stylesheet" href="styles.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <h1>Panel de Administración de Alumnos</h1>

    <p>
        Consulta de alumnos registrados mediante
        una API REST con Node.js, Express y MySQL.
    </p>

    <h2>Lista de alumnos</h2>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Carrera</th>
            </tr>
        </thead>
        <tbody id="tabla-alumnos">
            <tr>
                <td colspan="3">Cargando información...</td>
            </tr>
        </tbody>
    </table>

    <h2>Gráfica de alumnos por carrera</h2>

    <div style="max-width: 700px;">
        <canvas id="grafica-alumnos"></canvas>
    </div>

    <script src="script.js"></script>

</body>
</html>
